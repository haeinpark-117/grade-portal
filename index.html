<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grade Portal">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E %3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E %3Ccircle cx='38' cy='27' r='19' fill='%2322ff5e'/%3E %3Crect x='13' y='33' width='10' height='20' rx='3' fill='%23111111'/%3E %3Crect x='27' y='24' width='10' height='29' rx='3' fill='%23111111'/%3E %3Crect x='41' y='13' width='10' height='40' rx='3' fill='%232443ee'/%3E %3Ccircle cx='16.3' cy='38' r='1.5' fill='%23fff'/%3E%3Ccircle cx='19.7' cy='38' r='1.5' fill='%23fff'/%3E %3Ccircle cx='30.3' cy='29' r='1.5' fill='%23fff'/%3E%3Ccircle cx='33.7' cy='29' r='1.5' fill='%23fff'/%3E %3Ccircle cx='44.3' cy='18' r='1.6' fill='%23fff'/%3E%3Ccircle cx='47.7' cy='18' r='1.6' fill='%23fff'/%3E %3Crect x='9' y='53' width='46' height='2.6' rx='1.3' fill='%23111111'/%3E %3C/svg%3E">
  <link rel="apple-touch-icon" sizes="180x180" href="https://haeinpark-117.github.io/grade-portal/apple-touch-icon.png?v=9">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
  <style>
    /* v9 · LingQuest-style redesign: white page, heavy black grotesk + blue serif wordmark,
       hairline rules, underline input, blue pill button, neon-green accents. */
    :root{
      --ink:#111111; --ink-2:#555555; --ink-3:#9a9a9a; --rule:#111111; --hair:#e6e6e6; --soft:#f2f2f2;
      --blue:#2443ee; --green:#22ff5e; --err:#d92d50;
      --accent:#2443ee; --accent-soft:#eef0ff;   /* kept for the inline loading message */
      --grot:"Archivo","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      --sans:"Barlow","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      --serif:"Fraunces","Noto Serif KR",Georgia,serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{min-height:100vh;background:#ffffff;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:22px 20px 48px}
    .wrap{max-width:560px;margin:0 auto}
    .hidden{display:none!important}
    .num{font-variant-numeric:tabular-nums}
    svg{display:block}
    button{font-family:inherit}
    em{font-style:normal;color:var(--blue)}

    /* shared */
    .metaBar{display:flex;justify-content:space-between;gap:10px;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
    .rule{height:2px;background:var(--rule)}
    .eyebrow{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
    .muted{color:var(--ink-2);font-size:13.5px}
    .row{display:flex;align-items:center;gap:8px}
    .spin{display:inline-block;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* language toggle (text tabs) */
    .seg{display:inline-flex;gap:16px}
    .seg button{border:0;background:none;color:var(--ink-3);font:600 14px var(--sans);padding:4px 0;cursor:pointer;border-bottom:2px solid transparent;min-height:30px}
    .seg button.on{color:var(--ink);border-bottom-color:var(--blue)}
    .seg.mini{gap:10px}
    .seg.mini button{font-size:12px;letter-spacing:.1em;min-height:26px}

    /* ── code screen ── */
    #screenCode{display:flex;justify-content:center}
    .codeCard{width:100%;max-width:400px}
    .wordmark{margin:26px 0 10px;line-height:.86}
    .wordmark .a{display:block;font:900 76px var(--grot);letter-spacing:-.045em}
    .wordmark .b{display:block;font:600 78px var(--serif);color:var(--blue);letter-spacing:-.03em;margin-top:-4px;line-height:.95}
    .codeCard .sub{font:600 15.5px var(--sans);margin-bottom:12px}
    .art{width:100%;height:auto;margin-top:4px}
    .langRow{margin-top:18px}
    .fieldLabel{display:block;font:600 11.5px var(--sans);letter-spacing:.06em;color:var(--ink-2);margin-top:22px}
    .codeInput{width:100%;font:600 22px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:10px 2px 9px;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;background:transparent;color:var(--ink);outline:none;min-height:48px}
    .codeInput:focus{border-bottom-color:var(--blue);box-shadow:0 1.5px 0 var(--blue)}
    .codeInput::placeholder{letter-spacing:.02em;font-size:16px;font-weight:500;color:var(--ink-3)}
    .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:14px 16px;border-radius:999px;background:var(--blue);color:#fff;font:700 17px var(--grot);letter-spacing:-.01em;border:0;cursor:pointer;margin-top:26px}
    .btn:disabled{opacity:.6}
    .btn:active{transform:scale(.985)}
    .err{color:var(--err);font-size:14.5px;margin-top:12px;font-weight:500}
    .help{color:var(--ink-2);font-size:12.5px;margin-top:14px;line-height:1.6;text-align:center}

    /* ── dashboard ── */
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
    .logo{display:inline-flex;align-items:baseline;gap:5px;line-height:1}
    .logo b{font:900 21px var(--grot);letter-spacing:-.04em}
    .logo i{font:600 21px var(--serif);font-style:normal;color:var(--blue);letter-spacing:-.02em}
    .top .r2{display:flex;align-items:center;gap:12px}
    .who{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 0 12px}
    .who .nm{font:800 27px var(--grot);letter-spacing:-.03em;line-height:1.15;word-break:keep-all}
    .who .cs{font:500 13px var(--sans);color:var(--ink-2);margin-top:3px}
    .who .cd{font:600 12px var(--sans);letter-spacing:.18em;color:var(--ink-2);white-space:nowrap;text-align:right}
    .who .cd b{display:block;font:800 15px var(--grot);letter-spacing:.12em;color:var(--ink);margin-top:2px}
    .total{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px}
    .big{font:900 86px var(--grot);letter-spacing:-.05em;line-height:.85}
    .big small{font:700 20px var(--grot);letter-spacing:-.02em;color:var(--ink-3);margin-left:4px}
    .grade{text-align:right}
    .lg{font:600 60px var(--serif);color:var(--blue);line-height:.9;letter-spacing:-.02em}
    .grade .eyebrow{margin-top:6px}
    .chips{display:flex;gap:8px;margin:12px 0 2px;flex-wrap:wrap}
    .chip{flex:1;min-width:120px;border:1.5px solid var(--rule);border-radius:999px;padding:7px 10px;text-align:center;font:600 13px var(--sans)}
    .chip b{font:800 13.5px var(--grot);margin-left:3px}
    .chip.g{background:var(--green);border-color:var(--green)}
    .sec{margin-top:30px}
    .secHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
    .secHead h3{font:800 20px var(--grot);letter-spacing:-.025em}
    .notYet{font:600 15px var(--sans);color:var(--ink-3);padding-bottom:6px}

    .cat{padding:13px 0 12px;border-top:1px solid var(--hair);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .cats .cat:last-of-type{border-bottom:1px solid var(--hair)}
    .cat.dim{cursor:default}
    .cat .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .cat .n{font:600 15.5px var(--sans);min-width:0}
    .cat .pfx{font:600 10.5px var(--sans);letter-spacing:.12em;color:var(--ink-3);margin-left:7px;white-space:nowrap}
    .cat .sc{font:800 16px var(--grot);white-space:nowrap}
    .cat .sc small{font:500 12.5px var(--sans);color:var(--ink-3);margin-left:1px}
    .cat .sc .chev{display:inline-block;margin-left:8px;color:var(--ink-3);font-size:11px;transition:transform .15s}
    .cat.open .sc .chev{transform:rotate(90deg);color:var(--blue)}
    .cat.dim .sc{font:600 13px var(--sans);color:var(--ink-3)}
    .bar{height:6px;background:var(--soft);border-radius:3px;margin-top:9px;overflow:hidden}
    .bar b{display:block;height:100%;background:var(--ink);border-radius:3px}
    .cat.open .bar b{background:var(--blue)}
    .items{display:none;margin:0 0 12px;padding:2px 0 2px 12px;border-left:2px solid var(--blue)}
    .items.open{display:block}
    .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font:500 14px var(--sans)}
    .it .nm{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .it .v{font:700 14px var(--grot);white-space:nowrap}
    .it .v small{font:500 12px var(--sans);color:var(--ink-3)}
    .it .v.hi{background:var(--green);padding:1px 8px;border-radius:999px}
    .it .v.hi small{color:var(--ink)}
    .it.none .nm,.it.none .v{color:var(--ink-3);font-weight:500}

    /* v11 class-average comparison */
    .vs{margin:14px 0 2px}
    .vsHead{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 13px var(--sans);color:var(--ink-2)}
    .vsHead b{font:800 15px var(--grot);color:var(--ink);margin-left:4px}
    .delta{font:800 13px var(--grot);border-radius:999px;padding:3px 11px;background:var(--soft);color:var(--ink);opacity:0;transform:translateY(4px);transition:opacity .4s .9s,transform .4s .9s}
    .delta.up{background:var(--green)}
    .vs.go .delta{opacity:1;transform:none}
    .vsTrack{position:relative;height:10px;border-radius:5px;background:var(--soft);margin:36px 0 26px}
    .vsFill{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--blue);opacity:.9;width:0;transition:width 1s cubic-bezier(.22,1,.36,1) .3s}
    .vsAvg{position:absolute;top:-6px;width:2px;height:22px;background:var(--ink);transform:translateX(-1px)}
    .vsAvg em{position:absolute;top:24px;left:50%;transform:translateX(-50%);font:700 11px var(--sans);font-style:normal;color:var(--ink);white-space:nowrap}
    .vsMe{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--green);border:2px solid var(--ink);transform:translate(-50%,-50%);left:0;transition:left 1s cubic-bezier(.22,1,.36,1) .3s}
    .vsMe em{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font:800 11.5px var(--grot);font-style:normal;background:var(--ink);color:var(--green);border-radius:999px;padding:2px 8px;white-space:nowrap}
    .ringLegend{display:flex;align-items:center;gap:6px;justify-content:flex-end;font:600 11.5px var(--sans);color:var(--ink-3);margin-top:-4px}
    .ringLegend i{display:inline-block;width:3px;height:12px;background:var(--ink);border-radius:1px}
    /* v10 interactive */
    .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
    .ring{text-align:center;cursor:pointer;border-radius:16px;padding:8px 0 10px;transition:background .25s,transform .2s;-webkit-tap-highlight-color:transparent}
    .ring svg{width:92px;max-width:100%;margin:0 auto;display:block;transition:transform .25s cubic-bezier(.22,1,.36,1)}
    .ring .fg{transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1),stroke .25s}
    .ring .bgc{transition:stroke .25s}
    .ring .rn{font:800 13.5px var(--grot);margin-top:2px}
    .ring .rk{font:600 11.5px var(--sans);color:var(--ink-3)}
    .ring .more{display:inline-block;margin-top:3px;font:700 11px var(--grot);color:var(--blue);opacity:.75;transition:opacity .2s}
    .ring.dim{cursor:default}.ring.dim .more{visibility:hidden}
    @media (hover:hover){.ring:not(.dim):hover{background:#f3f5ff}.ring:not(.dim):hover svg{transform:scale(1.06)}.ring:not(.dim):hover .fg{stroke:#22ff5e}.ring:not(.dim):hover .more{opacity:1}}
    .ring:not(.dim):active{transform:scale(.97)}
    .ring.sel,.ring.sel:hover{background:#111!important;color:#fff}.ring.sel svg{transform:none!important}.ring.sel .rk{color:#bbb}.ring.sel text{fill:#fff}.ring.sel .fg{stroke:#22ff5e}.ring.sel .bgc{stroke:#333}.ring.sel .more{color:#22ff5e;opacity:1}.ring.sel .avgT{stroke:#fff}
    .ringDetail{margin-top:10px;border-left:2px solid var(--blue);padding:2px 0 2px 12px}
    .ringDetail .dh{font:800 14px var(--grot);margin-bottom:2px}
    .big .cu{display:inline-block}
    .lg.flip{animation:gpflip .6s cubic-bezier(.22,1,.36,1)}
    @keyframes gpflip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
    .dotplot,.prog2{position:relative;touch-action:pan-y;cursor:ew-resize}
    .dotplot .d{transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .4s}
    .gtip{position:absolute;top:0;pointer-events:none;background:#111;color:#fff;border-radius:10px;padding:6px 10px;font:600 12px var(--sans);white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s;z-index:2}
    .gtip b{font:800 13px var(--grot)}.gtip .g{color:#22ff5e}
    .gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .gchips button{font:800 14px var(--grot);border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;transition:background .2s,color .2s,transform .15s}
    .gchips button:active{transform:scale(.95)}
    .gchips button.on{background:var(--ink);color:#fff}
    .need{margin-top:12px;border:2px solid var(--ink);border-radius:16px;padding:14px 16px}
    .need .nh{font:600 12.5px var(--sans);color:var(--ink-2)}
    .need .nn{font:900 40px/1.05 var(--grot);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
    .need .nn small{font:600 15px var(--sans);color:var(--ink-3)}
    .meter{height:12px;background:var(--soft);border-radius:6px;margin-top:10px;position:relative;overflow:hidden}
    .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--blue);transition:width .6s cubic-bezier(.22,1,.36,1),background .3s}
    .estb{display:inline-block;font:800 10.5px var(--grot);letter-spacing:.04em;background:#fff1a8;color:#6b5a00;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px}
    .rem{display:flex;gap:3px;height:14px;border-radius:7px;overflow:hidden;margin-top:6px}
    .rem i{display:block;height:100%}
    .remlg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font:500 12px var(--sans);color:var(--ink-2)}
    .remlg b{font:800 12px var(--grot);color:var(--ink)}
    .remlg span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
    .legend{display:flex;gap:12px;font:500 12px var(--sans);color:var(--ink-2)}
    .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
    .chart svg{width:100%;height:auto}
    .chart text{font-family:var(--sans)}

    .fc{display:grid;grid-template-columns:1fr;gap:18px}
    .fc .projRow{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
    .fc .projRow .big{font-size:52px}
    .fc .projRow .lg{font-size:40px}
    .fc .goal{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin-top:10px;font-size:14px;line-height:1.4}
    .fc .lg.s{font:800 13px var(--grot);color:var(--ink);border:1.5px solid var(--rule);border-radius:999px;padding:3px 10px;line-height:1.2;text-align:center}
    .fc .lg.off{border-color:var(--hair);color:var(--ink-3)}
    .fc .goal b{font:800 14px var(--grot)}

    .note{font:500 12.5px var(--sans);color:var(--ink-2);margin-top:8px;line-height:1.55}

    .foot{color:var(--ink-2);font-size:12.5px;text-align:center;margin-top:28px;line-height:1.7}
    .foot a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
    .scaleNote{font:500 11.5px var(--sans);letter-spacing:.04em;color:var(--ink-3);margin-top:12px;line-height:1.7}
    @media (max-width:370px){.wordmark .a{font-size:64px}.wordmark .b{font-size:66px}.big{font-size:70px}.lg{font-size:50px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<div class="wrap">

  <!-- ═══ CODE SCREEN ═══ -->
  <div id="screenCode">
    <div class="codeCard">
      <div class="metaBar"><span>AELTS · KHU</span><span data-t="metaR"></span></div>
      <h1 class="wordmark"><span class="a">Grade</span><span class="b">Portal</span></h1>
      <p class="sub" data-t="sub"></p>
      <svg class="art" viewBox="0 0 338 132" aria-hidden="true">
        <circle cx="198" cy="66" r="62" fill="#22ff5e"/>
        <rect x="150" y="70" width="18" height="56" rx="5" fill="#111"/>
        <rect x="172" y="48" width="18" height="78" rx="5" fill="#111"/>
        <rect x="194" y="28" width="18" height="98" rx="5" fill="#2443ee"/>
        <circle cx="199" cy="44" r="3.2" fill="#fff"/><circle cx="208" cy="44" r="3.2" fill="#fff"/>
        <circle cx="177" cy="64" r="3" fill="#fff"/><circle cx="185" cy="64" r="3" fill="#fff"/>
        <circle cx="155" cy="86" r="3" fill="#fff"/><circle cx="163" cy="86" r="3" fill="#fff"/>
        <path d="M70 84c0-17 13-28 30-28s30 11 30 28v42H70z" fill="#111"/>
        <rect x="84" y="94" width="32" height="22" rx="3" fill="#fff"/>
        <path d="M90 105l5 5 11-11" stroke="#2443ee" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="92" cy="74" r="3.6" fill="#fff"/><circle cx="108" cy="74" r="3.6" fill="#fff"/>
        <path d="M238 92c0-9 7-15 16-15h14c9 0 16 6 16 15v12c0 9-7 15-16 15h-9l-9 8v-8c-7-2-12-8-12-15z" fill="#111"/>
        <text x="261" y="106" font-family="Fraunces,Georgia,serif" font-weight="600" font-size="17" fill="#fff" text-anchor="middle">A+</text>
        <circle cx="292" cy="80" r="2.6" fill="#9a9a9a"/><circle cx="298" cy="73" r="1.7" fill="#9a9a9a"/>
      </svg>
      <div class="rule"></div>
      <div class="langRow"><div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="en">English</button>
      </div></div>
      <label class="fieldLabel" for="codeInput" data-t="codeLabel"></label>
      <input class="codeInput" id="codeInput" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="goBtn" type="button"></button>
      <div id="errorMsg" class="err hidden"></div>
      <div id="waitMsg" class="hidden" style="margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;line-height:1.5"></div>
      <p class="help" data-t="help"></p>
    </div>
  </div>

  <!-- ═══ DASHBOARD ═══ -->
  <div id="screenDash" class="hidden"></div>
</div>

<script>
  // ═══════════════════════════════════════
  // I18N
  // ═══════════════════════════════════════
  var I18N = {

      if (rows.length && rows[rows.length - 1].d.getTime() === d.getTime()) rows[rows.length - 1] = row; else rows.push(row); }
    if (rows.length < 2) { window.__gpProg = null; return buildProgress(points); }
    var S = new Date(TERM_START.getFullYear(), TERM_START.getMonth(), 1), E = new Date(TERM_START.getTime() + TERM_WEEKS * 7 * 864e5 + 4 * 864e5), NOW = new Date();
    var W = 560, H = 220, PL = 34, PR = 12, PT = 26, PB = 32, mn = 100, mx = 0;
    rows.forEach(function (r) { mn = Math.min(mn, r.g, r.c === null ? r.g : r.c); mx = Math.max(mx, r.g, r.c === null ? r.g : r.c); });
    var cap = mx > 100 ? Math.ceil(mx / 5) * 5 + 5 : 100, lo = Math.max(0, Math.floor(mn / 10) * 10 - 5), hi = Math.min(cap, Math.ceil(mx / 10) * 10 + 5); if (hi - lo < 20) { lo = Math.max(0, lo - 10); hi = Math.min(cap, hi + 10); }
    function X(d) { return PL + (W - PL - PR) * (d - S) / (E - S); } function Y(v) { return PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo)); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="gpFut" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#f3f3f3"/></pattern><linearGradient id="gpPg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2443ee" stop-opacity=".18"/><stop offset="100%" stop-color="#2443ee" stop-opacity="0"/></linearGradient></defs>';
    var nowX = Math.max(PL, Math.min(W - PR, X(NOW)));
    if (NOW < E) s += '<rect x="' + nowX + '" y="' + (PT - 10) + '" width="' + (W - PR - nowX) + '" height="' + (H - PB - PT + 10) + '" fill="url(#gpFut)"/>' + (W - PR - nowX > 90 ? '<text x="' + ((nowX + W - PR) / 2) + '" y="' + Y(lo + (hi - lo) * .25) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#aaa">' + escSvg(t('restTerm')) + '</text>' : '');
    for (var gl = 0; gl <= 2; gl++) { var gv = lo + (hi - lo) * gl / 2; s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + Y(gv) + '" y2="' + Y(gv) + '" stroke="#ececec"/><text x="' + (PL - 6) + '" y="' + (Y(gv) + 4) + '" font-size="12" text-anchor="end" fill="#888">' + Math.round(gv) + '</text>'; }
    for (var mo = new Date(S); mo <= E; mo = new Date(mo.getFullYear(), mo.getMonth() + 1, 1)) { var x = X(mo); s += '<line x1="' + x + '" x2="' + x + '" y1="' + (H - PB) + '" y2="' + (H - PB + 5) + '" stroke="#999"/><text x="' + (x + 3) + '" y="' + (H - 10) + '" font-size="12.5" font-weight="700" fill="#555">' + escSvg(t('months')[mo.getMonth()]) + '</text>'; }
    s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + (H - PB) + '" y2="' + (H - PB) + '" stroke="#111" stroke-width="1.2"/>';
    if (NOW > S && NOW < E) s += '<line x1="' + nowX + '" x2="' + nowX + '" y1="' + (PT - 10) + '" y2="' + (H - PB) + '" stroke="#111" stroke-dasharray="3 3"/><text x="' + nowX + '" y="' + (PT - 14) + '" font-size="11.5" font-weight="800" text-anchor="middle" fill="#111">' + escSvg(t('today')) + '</text>';
    var pts = rows.map(function (r) { return { d: r.d, g: r.g, c: r.c, x: X(r.d), y: Y(r.g), cy: r.c === null ? null : Y(r.c) }; });
    var dm = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var cpts = pts.filter(function (p) { return p.cy !== null; });
    s += '<path class="ar" d="' + dm + ' L' + pts[pts.length - 1].x.toFixed(1) + ',' + Y(lo) + ' L' + pts[0].x.toFixed(1) + ',' + Y(lo) + ' Z" fill="url(#gpPg)" style="opacity:0;transition:opacity .8s 1s"/>';
    if (cpts.length > 1) s += '<path d="' + cpts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.cy.toFixed(1); }).join(' ') + '" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="4 4"/>';
    s += '<path class="ml" pathLength="1" d="' + dm + '" fill="none" stroke="#2443ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1"/>';
    s += '<line class="gd" x1="0" x2="0" y1="' + (PT - 6) + '" y2="' + (H - PB) + '" stroke="#111" opacity="0"/><circle class="cd" r="4.5" fill="#9a9a9a" opacity="0"/>';
    var lp = pts[pts.length - 1];
    s += '<circle class="md" cx="' + lp.x + '" cy="' + lp.y + '" r="6.5" fill="#22ff5e" stroke="#111" stroke-width="2" style="opacity:0;transition:opacity .3s"/>';
    window.__gpProg = { pts: pts };
    return s + '</svg>';
  }

  // ═══════════════════════════════════════
  // CHARTS (style A: rounded bars + KDE, lime "You")
  // ═══════════════════════════════════════
  function buildHistogram(grades, my) {
    var W = 460, H = 160, pL = 8, pR = 8, pT = 28, pB = 24;
    var cW = W - pL - pR, cH = H - pT - pB;
    var dMin = Math.min.apply(null, grades.concat([my])), dMax = Math.max.apply(null, grades.concat([my]));
    var cap = dMax > 100 ? Math.ceil(dMax / 5) * 5 + 5 : 100, rMin = Math.max(0, Math.floor(dMin / 10) * 10 - 5), rMax = Math.min(cap, Math.ceil(dMax / 10) * 10 + 5);
    if (rMax - rMin < 30) { rMin = Math.max(0, rMin - 10); rMax = Math.min(cap, rMax + 10); }
    var span = rMax - rMin;
    var nB = Math.max(5, Math.min(12, Math.round(Math.sqrt(grades.length) * 1.5)));
    var bins = []; for (var b = 0; b < nB; b++) bins.push(0);
    function binOf(v) { var i = Math.floor((v - rMin) / (span / nB)); return Math.max(0, Math.min(nB - 1, i)); }
    for (var i = 0; i < grades.length; i++) bins[binOf(grades[i])]++;
    var myBin = binOf(my), maxBin = Math.max.apply(null, bins.concat([1]));
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    var slot = cW / nB, gap = 6;
    for (var b2 = 0; b2 < nB; b2++) {
      var bh = bins[b2] ? Math.max(6, bins[b2] / maxBin * cH) : 0;
      if (b2 === myBin && !bh) bh = 6;
      if (!bh) continue;
      s += '<rect x="' + (pL + b2 * slot + gap / 2) + '" y="' + (pT + cH - bh) + '" width="' + (slot - gap) + '" height="' + bh + '" rx="3" fill="' + (b2 === myBin ? '#2443ee' : '#111111') + '"/>';
    }
    var mh = Math.max(6, bins[myBin] / maxBin * cH), cx = pL + myBin * slot + slot / 2;
    var lbl = t('you') + ' ' + my.toFixed(1), lw = lbl.length * 7 + 18;
    var lx = Math.max(pL, Math.min(W - pR - lw, cx - lw / 2)), ly = pT + cH - mh - 26;
    s += '<rect x="' + lx + '" y="' + ly + '" width="' + lw + '" height="20" rx="10" fill="#22ff5e"/><text x="' + (lx + lw / 2) + '" y="' + (ly + 14) + '" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111111">' + escSvg(lbl) + '</text>';
    s += '<line x1="' + pL + '" y1="' + (pT + cH + 1) + '" x2="' + (W - pR) + '" y2="' + (pT + cH + 1) + '" stroke="#111111" stroke-width="2"/>';
    for (var l = 0; l <= 4; l++) s += '<text x="' + (pL + cW * l / 4) + '" y="' + (H - 6) + '" text-anchor="' + (l === 0 ? 'start' : (l === 4 ? 'end' : 'middle')) + '" font-size="11" fill="#9a9a9a">' + Math.round(rMin + span * l / 4) + '</text>';
    return s + '</svg>';
  }

  function buildProgress(points) {
        var n = points.length, pL = 30, pR = 20, pT = 30, pB = 30, W = 380, H = 180, step = Math.max(1, Math.ceil(n / 6));
    var cW = W - pL - pR, cH = H - pT - pB, mn = 100, mx = 0;
    for (var i = 0; i < n; i++) { var g1 = points[i].grade, g2 = points[i].classGrade; if (g1 < mn) mn = g1; if (g1 > mx) mx = g1; if (g2 !== undefined && g2 !== null) { if (g2 < mn) mn = g2; if (g2 > mx) mx = g2; } }
        var cap = mx > 100 ? Math.ceil(mx / 5) * 5 + 5 : 100, rMin = Math.max(0, Math.floor(mn / 10) * 10 - 5), rMax = Math.min(cap, Math.ceil(mx / 10) * 10 + 5);
        if (rMax - rMin < 20) { rMin = Math.max(0, rMin - 10); rMax = Math.min(cap, rMax + 10); }
    function X(i) { return pL + cW * i / Math.max(1, n - 1); }
    function Y(v) { return pT + cH - cH * (v - rMin) / (rMax - rMin); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    for (var gl = 0; gl <= 3; gl++) { var gv = rMin + (rMax - rMin) * gl / 3, gy = Y(gv); s += '<line x1="' + pL + '" y1="' + gy + '" x2="' + (W - pR) + '" y2="' + gy + '" stroke="#e6e6e6"/><text x="' + (pL - 6) + '" y="' + (gy + 3) + '" text-anchor="end" font-size="12" fill="#777777">' + Math.round(gv) + '</text>'; }
    if (points[0].classGrade !== undefined) { var cp = []; for (var c = 0; c < n; c++) if (points[c].classGrade !== null) cp.push(X(c).toFixed(1) + ',' + Y(points[c].classGrade).toFixed(1)); s += '<polyline points="' + cp.join(' ') + '" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="3 3"/>'; }
    var pp = []; for (var p = 0; p < n; p++) pp.push(X(p).toFixed(1) + ',' + Y(points[p].grade).toFixed(1));
    s += '<polyline points="' + pp.join(' ') + '" fill="none" stroke="#2443ee" stroke-width="2.6" stroke-linejoin="round"/>';
    for (var d = 0; d < n; d++) {
      var last = d === n - 1;
      s += '<circle cx="' + X(d) + '" cy="' + Y(points[d].grade) + '" r="' + (last ? 6 : 3.2) + '" fill="' + (last ? '#22ff5e' : '#2443ee') + '" stroke="' + (last ? '#111111' : '#fff') + '" stroke-width="' + (last ? 1.5 : 1.5) + '"/>';
      if (last) s += '<text x="' + X(d) + '" y="' + (Y(points[d].grade) - 10) + '" text-anchor="' + (d === n - 1 ? 'end' : 'middle') + '" font-size="11.5" font-weight="700" fill="#111111">' + points[d].grade.toFixed(1) + '</text>';
      if ((n - 1 - d) % step !== 0 || (!last && step > 1 && n - 1 - d <= step)) continue;
      var lb = itemName(points[d].label); if (lb.length > 7) lb = lb.substring(0, 6) + '…';
            s += '<text x="' + X(d) + '" y="' + (H - 8) + '" text-anchor="' + (n > 1 && d === 0 ? 'start' : (last ? 'end' : 'middle')) + '" font-size="12" fill="#777777">' + escSvg(lb) + '</text>';
    }
    return s + '</svg>';
  }

  // ═══════════════════════════════════════
  // UTIL
  // ═══════════════════════════════════════
  function fmt(v) { v = Number(v); return (Math.round(v * 10) / 10).toString(); }
  function itemName(n) { // header may carry "English | 한국어"
    var parts = String(n || '').split('|');
    if (parts.length >= 2) return (LANG === 'ko' ? parts[1] : parts[0]).trim();
    return String(n || '').trim();
  }
  function fmtDate(s) { // "yyyy-MM-dd HH:mm"
    var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
    if (!m) return s;
    var d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
    var dow = LANG === 'ko' ? ['일','월','화','수','목','금','토'][d.getDay()] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    if (LANG === 'ko') return m[2] + '.' + m[3] + ' (' + dow + ') ' + m[4] + ':' + m[5];
    var mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    return mon + ' ' + (+m[3]) + ' (' + dow + ') ' + m[4] + ':' + m[5];
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function escSvg(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
