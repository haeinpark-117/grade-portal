<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Midterm Results · Intro to EL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Ccircle cx='38' cy='27' r='19' fill='%2322ff5e'/%3E%3Crect x='13' y='33' width='10' height='20' rx='3' fill='%23111111'/%3E%3Crect x='27' y='24' width='10' height='29' rx='3' fill='%23111111'/%3E%3Crect x='41' y='13' width='10' height='40' rx='3' fill='%232443ee'/%3E%3Crect x='9' y='53' width='46' height='2.6' rx='1.3' fill='%23111111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
:root{--ink:#111;--ink2:#555;--ink3:#9a9a9a;--hair:#e6e6e6;--blue:#2443ee;--green:#22ff5e;--err:#d92d50;
--grot:"Archivo","Noto Sans KR",-apple-system,system-ui,sans-serif;--sans:"Barlow","Noto Sans KR",-apple-system,system-ui,sans-serif;--serif:"Fraunces",Georgia,serif;
--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:22px 16px 56px}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.course{font:700 12px var(--grot);letter-spacing:.06em;color:var(--ink3)}
.lang button{font:700 12px var(--grot);border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:3px 10px;cursor:pointer;transition:background .2s,color .2s}
.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0;border-left:0}
.lang button.on{background:var(--ink);color:#fff}
h1{font:900 34px/1.05 var(--grot);letter-spacing:-.02em}
h1 em{font:600 34px var(--serif);color:var(--blue);font-style:normal}
.sub{color:var(--ink2);margin-top:6px;font-size:14px}

/* score card */
.ask{margin-top:22px;border:2px solid var(--ink);border-radius:18px;padding:16px 18px 14px;transition:box-shadow .3s var(--ease)}
.ask.live{box-shadow:6px 6px 0 var(--green)}
.ask label{display:block;font:700 12px var(--grot);letter-spacing:.06em;color:var(--ink3)}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:4px}
.row input{width:150px;font:900 46px/1 var(--grot);letter-spacing:-.03em;border:0;border-bottom:2px solid var(--ink);padding:2px 0;outline:none;background:transparent;color:var(--ink)}
.row input::placeholder{color:#d6d6d6}
.row .of{font:600 18px var(--sans);color:var(--ink3);padding-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:30px}
.chip{border-radius:999px;padding:4px 12px;font:700 14px var(--grot);white-space:nowrap;opacity:0;transform:translateY(6px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
.live .chip{opacity:1;transform:none}
.slider{margin-top:16px;position:relative}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue) var(--p,0%),#e9e9e9 var(--p,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#e9e9e9}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--green);border:2px solid var(--ink);margin-top:-10px;transition:transform .15s}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.ticks{display:flex;justify-content:space-between;font:600 11px var(--grot);color:var(--ink3);margin-top:-2px;padding:0 4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:8px}

/* tabs */
.tabs{position:relative;display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;margin:28px 0 12px}
.tabs .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--ink);transition:transform .4s var(--ease),width .4s var(--ease)}
.tabs button{position:relative;z-index:1;font:700 13px var(--grot);border:0;background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer;color:var(--ink);transition:color .3s}
.tabs button.on{color:#fff}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--hair)}
.stats div{padding:12px 4px}
.stats .k{font-size:12.5px;color:var(--ink3);font-weight:600}
.stats .v{font:800 28px var(--grot);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats .v small{font:600 14px var(--sans);color:var(--ink3)}
h2{font:800 19px var(--grot);margin:26px 0 2px}
h2 em{color:var(--blue);font-style:normal}
.why{font-size:13px;color:var(--ink2);margin-bottom:8px}

/* dot plot */
#plot{position:relative;touch-action:pan-y}
#plot svg{display:block;width:100%;overflow:visible}
.dot{transition:transform .7s var(--ease),opacity .45s,fill .3s}
.mecirc{transition:transform .45s var(--ease),opacity .3s}
.guide{transition:transform .45s var(--ease),opacity .3s}
.medl{transition:transform .6s var(--ease)}
.colhl{transition:opacity .2s}
.tip{position:absolute;top:0;transform:translate(-50%,-110%);background:var(--ink);color:#fff;font:700 12px var(--grot);padding:4px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.tip.on{opacity:1}

/* bands */
.band{display:flex;align-items:center;gap:10px;margin:7px 0;border-radius:9px;transition:background .3s}
.band .lt{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;font:900 13px var(--grot);margin-right:8px;flex:none;transition:background .3s}
.band.mine .lt{background:var(--blue)}
.band .n{width:150px;font:700 13.5px var(--grot);display:flex;align-items:center}
.band .t{flex:1;height:26px;background:#f2f2f2;border-radius:7px;overflow:hidden}
.band .t i{display:block;height:100%;width:0;background:var(--ink);border-radius:7px;transition:width .8s var(--ease),background .3s}
.band.mine .t i{background:var(--blue)}
.band .c{width:76px;text-align:right;font:700 13.5px var(--grot);font-variant-numeric:tabular-nums}
.band .c span{color:var(--ink3);font-weight:600}
.you{display:inline-block;font:700 11px var(--grot);background:var(--green);border-radius:999px;padding:1px 7px;margin-left:6px;transform:scale(0);transition:transform .3s var(--ease)}
.band.mine .you{transform:scale(1)}
.foot{margin-top:30px;font-size:12px;color:var(--ink3)}
svg text{font-family:var(--sans)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="wrap">

<div class="top"><span class="course">INTRO TO ENGLISH LINGUISTICS</span>
  <span class="lang"><button data-l="ko" class="on">KO</button><button data-l="en">EN</button></span></div>

<h1>Midterm <em>Results</em></h1>
<p class="sub" data-t="sub"></p>

<div class="ask" id="ask">
  <label for="sc" data-t="ask"></label>
  <div class="row">
    <input id="sc" type="text" inputmode="decimal" autocomplete="off" placeholder="—" aria-describedby="hint">
    <span class="of">/ 30</span>
    </div>
  <div class="chips"><span class="chip" id="c2" style="background:var(--green)"></span></div>
  <div class="slider"><input id="rg" type="range" min="0" max="32" step="0.1" value="24" aria-label="score"></div>
  <div class="ticks"><span>0</span><span>8</span><span>16</span><span>24</span><span>32</span></div>
  <div class="hint" id="hint" data-t="hint"></div>
</div>

<div class="tabs" id="tabs"><span class="pill" id="pill"></span><button class="on" data-k="all" data-t="all"></button><button data-k="00" data-t="s00"></button><button data-k="01" data-t="s01"></button></div>

<div class="stats">
  <div><div class="k" data-t="avg"></div><div class="v" id="avg"></div></div>
  <div><div class="k" data-t="med"></div><div class="v" id="med"></div></div>
  <div><div class="k" data-t="n"></div><div class="v" id="n"></div></div>
</div>

<h2 data-t="h1"></h2>
<p class="why" data-t="w1"></p>
<div id="plot"><div class="tip" id="tip"></div></div>

<h2 data-t="h2"></h2>
<p class="why" data-t="w2"></p>
<div id="bands"></div>

<p class="foot" data-t="foot"></p>
</div>
<script>
// Scores only (Midterm + Extra credit), sorted per section. No names or codes are stored in this page.
var S00=[9,14.3,17.6,19,19,19.1,21.8,22,23.1,23.5,23.5,24.6,25.3,26,26,26.1,27,27.8,28,28,28.6,29,29,29.3,29.6,29.6,30,30,30];
var S01=[14.3,14.5,17.5,17.6,19.6,19.8,23,23,23,23.5,23.5,23.6,24,24,24.3,24.5,25.6,26.6,27.5,28,28,28.5,28.5,29,29.3,29.3,29.6,30.5];
var PTS=[];S00.forEach(function(v){PTS.push({v:v,s:'00'});});S01.forEach(function(v){PTS.push({v:v,s:'01'});});
var T={
 ko:{sub:'중간고사 점수 = 시험 30점 + Extra credit (최대 2점)',ask:'내 중간고사 점수 (EC 포함)',
  hint:'점수를 입력하거나 슬라이더를 움직여 보세요. Grade Portal의 Midterm 항목에서 Midterm과 ExtraCredit 점수를 더한 값입니다. 입력한 점수는 이 화면에만 표시되고 저장되지 않습니다.',
  all:'전체',s00:'00분반',s01:'01분반',avg:'평균',med:'30점 이상',n:'응시',unit:'명',
  h1:'모든 점수를 <em>한눈에</em>',w1:'점 하나가 학생 한 명입니다. 점을 누르면 그 점수대 인원이 보입니다.',
  h2:'점수 <em>구간</em>',w2:'30점 만점 기준 90%(27점) 이상 A, 80%(24점) 이상 B, 70%(21점) 이상 C로 나눈 참고용 구간이며 최종 학점과는 다릅니다. 파란 막대가 내가 속한 구간입니다.',
  top:function(s,p){return s+' 상위 '+p+'%';},diff:function(d){return '평균 '+d;},
  bands:['27점 이상','24 – 26.9','21 – 23.9','21점 미만'],me:'나',medl:'중앙값',
  col:function(c,n){return c+'점대 '+n+'명';},
  foot:'이 페이지에는 학생 이름이나 코드 없이 점수 목록만 들어 있습니다.'},
 en:{sub:'Midterm score = exam (30 pts) + extra credit (up to 2 pts)',ask:'My midterm score (incl. EC)',
  hint:'Type your score or drag the slider. It is your Midterm plus ExtraCredit under Midterm in the Grade Portal. Nothing you enter is saved.',
  all:'All',s00:'Section 00',s01:'Section 01',avg:'Mean',med:'30 or above',n:'Students',unit:'',
  h1:'Every score <em>at a glance</em>',w1:'Each dot is one student. Tap a dot to see how many scored in that range.',
  h2:'Score <em>bands</em>',w2:'Bands for reference: A = 90% (27 pts) or above, B = 80% (24), C = 70% (21). These are not final course grades. The blue bar is your band.',
  top:function(s,p){return 'Top '+p+'% · '+s;},diff:function(d){return d+' vs. mean';},
  bands:['27 and above','24 – 26.9','21 – 23.9','Below 21'],me:'You',medl:'Median',
  col:function(c,n){return c+'–'+c+'.9: '+n;},
  foot:'This page contains only a list of scores, with no student names or codes.'}
};
var LANG='ko',K='all',ME=null;
var B=[[27,99],[24,27],[21,24],[0,21]],LET=['A','B','C',''];
function cur(){return PTS.filter(function(p){return K==='all'||p.s===K;}).map(function(p){return p.v;}).sort(function(a,b){return a-b;});}
function mean(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length;}
function med(a){var m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}
function t(k){return T[LANG][k];}

// animated number
var tw={};
function countTo(id,to,dec,suffix){
  var el=document.getElementById(id),from=tw[id]===undefined?to:tw[id],t0=performance.now(),d=600;tw[id]=to;
  function step(now){var p=Math.min(1,(now-t0)/d),e=1-Math.pow(1-p,3),v=from+(to-from)*e;
    el.innerHTML=(dec?v.toFixed(dec):Math.round(v))+(suffix||'');if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

// ---------- dot plot (built once, then moved) ----------
var W=560,LO=8,HI=31,PL=10,PR=10,R=6.2,STEP=13;
function X(v){return PL+(v-LO)/(HI-LO)*(W-PL-PR);}
var MAXH=0;(function(){var c={};PTS.forEach(function(p){var k=Math.floor(p.v);c[k]=(c[k]||0)+1;if(c[k]>MAXH)MAXH=c[k];});})();
var BASE=34+(MAXH+1)*STEP,H=BASE+34,NS='http://www.w3.org/2000/svg';
var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}
var colhl=el('rect',{x:0,y:8,width:X(1)-X(0),height:BASE-2,rx:6,fill:'#eef0ff',opacity:0,'class':'colhl'});
el('line',{x1:PL,x2:W-PR,y1:BASE+8,y2:BASE+8,stroke:'#111','stroke-width':1.5});
for(var g=10;g<=30;g+=5){var tx=el('text',{x:X(g+.5),y:BASE+26,'font-size':12,'text-anchor':'middle',fill:'#777'});tx.textContent=g;}
var guide=el('line',{x1:0,x2:0,y1:10,y2:BASE+8,stroke:'#22c55e','stroke-width':2,opacity:0,'class':'guide'});
var dots=PTS.map(function(p,i){var c=el('circle',{cx:0,cy:0,r:R,fill:'#2443ee','class':'dot'});c.style.opacity=0;c.style.transform='translate('+X(Math.floor(p.v)+.5)+'px,'+(BASE+40)+'px)';c.style.transitionDelay=(i*12)+'ms';return c;});
var meC=el('circle',{cx:0,cy:0,r:R+1.5,fill:'#22ff5e',stroke:'#111','stroke-width':2,'class':'mecirc'});meC.style.opacity=0;
var meT=el('text',{x:0,y:0,'font-size':12,'font-weight':800,'text-anchor':'middle','class':'mecirc'});meT.style.opacity=0;
document.getElementById('plot').appendChild(svg);

var READY=false;
function layout(){
  if(!READY)return;
  var cols={},hiddenX=X(19.5);
  var meCol=ME===null?null:Math.min(30,Math.max(LO,Math.floor(ME))),meSlot=null,skipped=false;
  PTS.forEach(function(p,i){
    var on=K==='all'||p.s===K,c=dots[i];
    if(!on){c.style.opacity=0;c.style.transform='translate('+X(Math.floor(p.v)+.5)+'px,'+(BASE+4)+'px) scale(.2)';return;}
    var k=Math.floor(p.v);cols[k]=cols[k]||[];
    // if this student's score equals mine, the first match becomes "me"
    if(ME!==null&&!skipped&&k===meCol&&Math.abs(p.v-ME)<0.05){skipped=true;c.style.opacity=0;c.style.transform='translate('+X(k+.5)+'px,'+(BASE-meSlot*STEP)+'px)';return;}
    cols[k].push(i);
  });
  Object.keys(cols).forEach(function(k){cols[k].forEach(function(i,j){
    var c=dots[i];if(c.style.opacity==='0'&&ME!==null&&Math.floor(PTS[i].v)===meCol&&j===meSlot)return;
    c.style.opacity=.85;c.style.transform='translate('+X(+k+.5)+'px,'+(BASE-j*STEP)+'px)';});});
  if(ME!==null){
    var h=meSlot!==null?meSlot:(cols[meCol]||[]).length,mx=X(meCol+.5),my=BASE-h*STEP;
    meC.style.opacity=1;meC.style.transform='translate('+mx+'px,'+my+'px)';
    meT.textContent=t('me');meT.style.opacity=1;meT.style.transform='translate('+mx+'px,'+(my-12)+'px)';
    
  } else {meC.style.opacity=0;meT.style.opacity=0;guide.style.opacity=0;}
  
  window.__cols=cols;
}

// tap a dot column -> show count
var tip=document.getElementById('tip'),tipTimer;
svg.addEventListener('click',function(e){
  var r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*W,v=LO+(vx-PL)/(W-PL-PR)*(HI-LO),k=Math.floor(v);
  var n=cur().filter(function(x){return Math.floor(x)===k;}).length;if(k<LO||k>30)return;
  colhl.setAttribute('x',X(k));colhl.style.opacity=1;
  tip.textContent=t('col')(k,n);tip.style.left=(X(k+.5)/W*100)+'%';tip.style.top=((BASE-Math.max(n,1)*STEP)/H*r.height)+'px';tip.classList.add('on');
  clearTimeout(tipTimer);tipTimer=setTimeout(function(){tip.classList.remove('on');colhl.style.opacity=0;},1800);
});

// ---------- bands ----------
var bandsEl=document.getElementById('bands'),bandRows=B.map(function(){var d=document.createElement('div');d.className='band';
  d.innerHTML='<div class="n"><b class="lt"></b><span class="bl"></span><span class="you"></span></div><div class="t"><i></i></div><div class="c"></div>';bandsEl.appendChild(d);return d;});

function render(){
  var a=cur(),m=mean(a),md=med(a);
  countTo('avg',m,1);countTo('med',a.filter(function(x){return x>=30;}).length,0,t('unit')?'<small>'+t('unit')+'</small>':'');countTo('n',a.length,0,t('unit')?'<small>'+t('unit')+'</small>':'');
  var ask=document.getElementById('ask');
  if(ME!==null){
    var above=0;for(var i=0;i<a.length;i++)if(a[i]>ME)above++;
    var top=Math.min(100,Math.max(1,Math.round((above+1)/a.length*100))),d=ME-m;
    var scope=t(K==='all'?'all':(K==='00'?'s00':'s01'));
    document.getElementById('c2').textContent=t('diff')((d>=0?'+':'')+f1(d));
    ask.classList.add('live');
  } else ask.classList.remove('live');
  layout();
  var counts=B.map(function(b){return a.filter(function(x){return x>=b[0]&&x<b[1];}).length;}),mx=Math.max.apply(null,counts);
  bandRows.forEach(function(row,i){var b=B[i],mine=ME!==null&&ME>=b[0]&&ME<b[1];
    row.className='band'+(mine?' mine':'');row.querySelector('.bl').textContent=t('bands')[i];var lt=row.querySelector('.lt');lt.textContent=LET[i];lt.style.visibility=LET[i]?'visible':'hidden';row.querySelector('.you').textContent=t('me');
    row.querySelector('i').style.width=(counts[i]/mx*100)+'%';
    row.querySelector('.c').innerHTML=counts[i]+(LANG==='ko'?'명':'')+' <span>'+Math.round(counts[i]/a.length*100)+'%</span>';});
}

// ---------- inputs ----------
var sc=document.getElementById('sc'),rg=document.getElementById('rg');
function setTrack(){rg.style.setProperty('--p',(rg.value/32*100)+'%');}
function fromText(){
  var v=sc.value.trim().replace(',','.'),n=parseFloat(v);
  if(v===''||isNaN(n)||n<0||n>32){ME=null;}else{ME=Math.round(n*10)/10;rg.value=ME;setTrack();}
  render();
}
sc.addEventListener('input',fromText);
rg.addEventListener('input',function(){ME=Math.round(parseFloat(rg.value)*10)/10;sc.value=f1(ME);setTrack();render();});
setTrack();

// tabs with sliding pill
var tb=[].slice.call(document.querySelectorAll('#tabs button')),pill=document.getElementById('pill');
function movePill(){var on=document.querySelector('#tabs button.on');pill.style.width=on.offsetWidth+'px';pill.style.transform='translateX('+(on.offsetLeft-3)+'px)';}
tb.forEach(function(b){b.onclick=function(){tb.forEach(function(x){x.classList.remove('on');});b.classList.add('on');K=b.getAttribute('data-k');movePill();render();};});

function applyLang(){
  document.documentElement.lang=LANG;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(e){var v=t(e.getAttribute('data-t'));if(typeof v==='string')e.innerHTML=v;});
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.className=b.getAttribute('data-l')===LANG?'on':'';});
  movePill();render();
}
[].forEach.call(document.querySelectorAll('.lang button'),function(b){b.onclick=function(){LANG=b.getAttribute('data-l');applyLang();};});

applyLang();
// entrance: dots rise into place, then clear stagger so later moves are simultaneous
