<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Midterm Results · Intro to EL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Ccircle cx='38' cy='27' r='19' fill='%2322ff5e'/%3E%3Crect x='13' y='33' width='10' height='20' rx='3' fill='%23111111'/%3E%3Crect x='27' y='24' width='10' height='29' rx='3' fill='%23111111'/%3E%3Crect x='41' y='13' width='10' height='40' rx='3' fill='%232443ee'/%3E%3Crect x='9' y='53' width='46' height='2.6' rx='1.3' fill='%23111111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
:root{--ink:#111;--ink2:#555;--ink3:#9a9a9a;--hair:#e6e6e6;--blue:#2443ee;--green:#22ff5e;--err:#d92d50;
--grot:"Archivo","Noto Sans KR",-apple-system,system-ui,sans-serif;--sans:"Barlow","Noto Sans KR",-apple-system,system-ui,sans-serif;--serif:"Fraunces",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:22px 16px 56px}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.course{font:700 12px var(--grot);letter-spacing:.06em;color:var(--ink3)}
.lang button{font:700 12px var(--grot);border:1.5px solid var(--ink);background:#fff;padding:3px 10px;cursor:pointer}
.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0;border-left:0}
.lang button.on{background:var(--ink);color:#fff}
h1{font:900 34px/1.05 var(--grot);letter-spacing:-.02em}
h1 em{font:600 34px var(--serif);color:var(--blue);font-style:normal}
.sub{color:var(--ink2);margin-top:6px;font-size:14px}
.ask{margin-top:22px;border:2px solid var(--ink);border-radius:16px;padding:16px 18px}
.ask label{display:block;font:700 12px var(--grot);letter-spacing:.06em;color:var(--ink3)}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:6px}
.row input{flex:1;min-width:0;font:900 40px/1 var(--grot);letter-spacing:-.02em;border:0;border-bottom:2px solid var(--ink);padding:4px 0;outline:none;background:transparent;color:var(--ink)}
.row input::placeholder{color:#d0d0d0}
.row .of{font:600 18px var(--sans);color:var(--ink3);padding-bottom:8px}
.row button{font:700 15px var(--grot);background:var(--blue);color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
.hint{font-size:12.5px;color:var(--ink3);margin-top:8px}
.err{font-size:13px;color:var(--err);margin-top:8px;display:none}
.chips{margin-top:12px;display:none}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font:700 14px var(--grot);margin:0 6px 6px 0}
.tabs{display:flex;gap:6px;margin:28px 0 12px}
.tabs button{font:700 13px var(--grot);border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--hair)}
.stats div{padding:12px 4px}
.stats .k{font-size:12.5px;color:var(--ink3);font-weight:600}
.stats .v{font:800 28px var(--grot);letter-spacing:-.02em}
.stats .v small{font:600 14px var(--sans);color:var(--ink3)}
h2{font:800 19px var(--grot);margin:26px 0 2px}
h2 em{color:var(--blue);font-style:normal}
.why{font-size:13px;color:var(--ink2);margin-bottom:8px}
.band{display:flex;align-items:center;gap:10px;margin:7px 0}
.band .n{width:88px;font:700 13.5px var(--grot)}
.band .t{flex:1;height:26px;background:#f2f2f2;border-radius:7px;overflow:hidden}
.band .t i{display:block;height:100%;background:var(--ink);border-radius:7px}
.band.mine .t i{background:var(--blue)}
.band .c{width:76px;text-align:right;font:700 13.5px var(--grot)}
.band .c span{color:var(--ink3);font-weight:600}
.you{display:inline-block;font:700 11px var(--grot);background:var(--green);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.foot{margin-top:30px;font-size:12px;color:var(--ink3)}
svg text{font-family:var(--sans)}
</style>
</head>
<body><div class="wrap">

<div class="top"><span class="course">INTRO TO ENGLISH LINGUISTICS</span>
  <span class="lang"><button data-l="ko" class="on">KO</button><button data-l="en">EN</button></span></div>

<h1>Midterm <em>Results</em></h1>
<p class="sub" data-t="sub"></p>

<div class="ask">
  <label for="sc" data-t="ask"></label>
  <div class="row">
    <input id="sc" type="text" inputmode="decimal" autocomplete="off" placeholder="00.0">
    <span class="of">/ 30</span>
    <button id="go" type="button" data-t="go"></button>
  </div>
  <div class="hint" data-t="hint"></div>
  <div class="err" id="err" data-t="err"></div>
  <div class="chips" id="chips"></div>
</div>

<div class="tabs" id="tabs"><button class="on" data-k="all" data-t="all"></button><button data-k="00" data-t="s00"></button><button data-k="01" data-t="s01"></button></div>

<div class="stats">
  <div><div class="k" data-t="avg"></div><div class="v" id="avg"></div></div>
  <div><div class="k" data-t="med"></div><div class="v" id="med"></div></div>
  <div><div class="k" data-t="n"></div><div class="v" id="n"></div></div>
</div>

<h2 data-t="h1"></h2>
<p class="why" data-t="w1"></p>
<div id="dots"></div>

<h2 data-t="h2"></h2>
<p class="why" data-t="w2"></p>
<div id="bands"></div>

<p class="foot" data-t="foot"></p>
</div>
<script>
// Scores only (Midterm + Extra credit), sorted. No names or codes are stored in this page.
var S00=[9,14.3,17.6,19,19,19.1,21.8,22,23.1,23.5,23.5,24.6,25.3,26,26,26.1,27,27.8,28,28,28.6,29,29,29.3,29.6,29.6,30,30,30];
var S01=[14.3,14.5,17.5,17.6,19.6,19.8,23,23,23,23.5,23.5,23.6,24,24,24.3,24.5,25.6,26.6,27.5,28,28,28.5,28.5,29,29.3,29.3,29.6,30.5];
var D={all:S00.concat(S01).sort(function(a,b){return a-b;}),'00':S00,'01':S01};
var T={
 ko:{sub:'중간고사 점수 = 시험 30점 + Extra credit (최대 2점)',ask:'내 중간고사 점수 (EC 포함)',go:'확인',
  hint:'Grade Portal의 Midterm 항목에 있는 Midterm 점수와 ExtraCredit 점수를 더해서 입력하세요. 입력한 점수는 이 화면에만 표시되고 어디에도 저장되지 않습니다.',
  err:'0에서 32 사이의 숫자를 입력하세요.',all:'전체',s00:'00분반',s01:'01분반',avg:'평균',med:'중앙값',n:'응시',unit:'명',
  h1:'모든 점수를 <em>한눈에</em>',w1:'점 하나가 학생 한 명입니다. 점선은 중앙값, 초록 점은 내 점수입니다.',
  h2:'점수 <em>구간</em>',w2:'각 구간에 몇 명이 있는지 보여줍니다. 파란 막대가 내가 속한 구간입니다.',
  top:function(s,p){return s+' 상위 '+p+'%';},diff:function(d){return '평균보다 '+d+'점';},
  bands:['27점 이상','24 – 26.9','21 – 23.9','18 – 20.9','18점 미만'],me:'나',medl:'중앙값',
  foot:'이 페이지에는 학생 이름이나 코드 없이 점수 목록만 들어 있습니다.'},
 en:{sub:'Midterm score = exam (30 pts) + extra credit (up to 2 pts)',ask:'My midterm score (incl. EC)',go:'Show',
  hint:'In the Grade Portal, add your Midterm and ExtraCredit scores under Midterm and enter the total. The number you enter stays on this screen and is not saved anywhere.',
  err:'Enter a number between 0 and 32.',all:'All',s00:'Section 00',s01:'Section 01',avg:'Mean',med:'Median',n:'Students',unit:'',
  h1:'Every score <em>at a glance</em>',w1:'Each dot is one student. The dashed line is the median; the green dot is you.',
  h2:'Score <em>bands</em>',w2:'How many students fall in each band. The blue bar is your band.',
  top:function(s,p){return 'Top '+p+'% of '+s;},diff:function(d){return d+' vs. mean';},
  bands:['27 and above','24 – 26.9','21 – 23.9','18 – 20.9','Below 18'],me:'You',medl:'Median',
  foot:'This page contains only a list of scores, with no student names or codes.'}
};
var LANG='ko',K='all',ME=null;
var B=[[27,99],[24,27],[21,24],[18,21],[0,18]];
function mean(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length;}
function med(a){var m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}
function t(k){return T[LANG][k];}

function applyLang(){
  document.documentElement.lang=LANG;
  var els=document.querySelectorAll('[data-t]');
  for(var i=0;i<els.length;i++){var v=t(els[i].getAttribute('data-t'));if(typeof v==='string')els[i].innerHTML=v;}
  var lb=document.querySelectorAll('.lang button');for(var j=0;j<lb.length;j++)lb[j].className=lb[j].getAttribute('data-l')===LANG?'on':'';
  render();
}

function render(){
  var a=D[K],m=mean(a),md=med(a);
  document.getElementById('avg').textContent=f1(m);
  document.getElementById('med').textContent=f1(md);
  document.getElementById('n').innerHTML=a.length+(t('unit')?'<small>'+t('unit')+'</small>':'');
  var scope=t(K==='all'?'all':(K==='00'?'s00':'s01'));
  var ch=document.getElementById('chips');
  if(ME!==null){
    var above=0;for(var i=0;i<a.length;i++)if(a[i]>ME)above++;
    var top=Math.min(100,Math.max(1,Math.round((above+1)/a.length*100)));
    var d=ME-m,ds=(d>=0?'+':'')+f1(d);
    ch.innerHTML='<span class="chip" style="background:var(--green)">'+t('top')(scope,top)+'</span><span class="chip" style="background:#eef0ff;color:var(--blue)">'+t('diff')(ds)+'</span>';
    ch.style.display='block';
  } else ch.style.display='none';

  // dot plot: one dot per student, stacked in 1-point columns
  var W=560,lo=8,hi=31,pL=10,pR=10,r=6.2,step=13;
  function X(v){return pL+(v-lo)/(hi-lo)*(W-pL-pR);}
  var cols={},maxh=1;
  for(var j=0;j<a.length;j++){var c=Math.floor(a[j]);(cols[c]=cols[c]||[]).push(a[j]);if(cols[c].length>maxh)maxh=cols[c].length;}
  var meCol=ME===null?null:Math.min(30,Math.max(lo,Math.floor(ME)));
  var extra=(meCol!==null&&!(cols[meCol]||[]).some(function(v){return Math.abs(v-ME)<0.05;}))?1:0;
  var base=28+(maxh+extra)*step,H=base+34;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  s+='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+(base+8)+'" y2="'+(base+8)+'" stroke="#111" stroke-width="1.5"/>';
  for(var g=10;g<=30;g+=5)s+='<text x="'+X(g+.5)+'" y="'+(base+26)+'" font-size="12" text-anchor="middle" fill="#777">'+g+'</text>';
  var meDrawn=false;
  for(var key in cols){var arr=cols[key];for(var k=0;k<arr.length;k++){
    var isMe=!meDrawn&&ME!==null&&+key===meCol&&Math.abs(arr[k]-ME)<0.05;if(isMe)meDrawn=true;
    s+='<circle cx="'+X(+key+.5)+'" cy="'+(base-k*step)+'" r="'+r+'" fill="'+(isMe?'#22ff5e':'#2443ee')+'"'+(isMe?' stroke="#111" stroke-width="2"':' opacity=".85"')+'/>';}}
  if(ME!==null&&!meDrawn){var h=(cols[meCol]||[]).length;s+='<circle cx="'+X(meCol+.5)+'" cy="'+(base-h*step)+'" r="'+(r+1)+'" fill="#22ff5e" stroke="#111" stroke-width="2"/>';}
  var mx=X(Math.floor(md)+.5);
  s+='<line x1="'+mx+'" x2="'+mx+'" y1="12" y2="'+(base+8)+'" stroke="#111" stroke-dasharray="4 3"/>';
  s+='<text x="'+(mx-5)+'" y="20" font-size="12" font-weight="700" text-anchor="end">'+t('medl')+' '+f1(md)+'</text>';
  document.getElementById('dots').innerHTML=s+'</svg>';

  // bands
  var counts=B.map(function(b){return a.filter(function(x){return x>=b[0]&&x<b[1];}).length;}),mx2=Math.max.apply(null,counts),html='';
  B.forEach(function(b,i){var mine=ME!==null&&ME>=b[0]&&ME<b[1];
    html+='<div class="band'+(mine?' mine':'')+'"><div class="n">'+t('bands')[i]+(mine?'<span class="you">'+t('me')+'</span>':'')+'</div><div class="t"><i style="width:'+(counts[i]/mx2*100)+'%"></i></div><div class="c">'+counts[i]+(LANG==='ko'?'명':'')+' <span>'+Math.round(counts[i]/a.length*100)+'%</span></div></div>';});
  document.getElementById('bands').innerHTML=html;
}

function submit(){
  var v=document.getElementById('sc').value.trim().replace(',','.'),n=parseFloat(v),err=document.getElementById('err');
  if(v===''||isNaN(n)||n<0||n>32){err.style.display='block';ME=null;}else{err.style.display='none';ME=Math.round(n*10)/10;}
  render();
}
document.getElementById('go').onclick=submit;
document.getElementById('sc').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
var tb=document.querySelectorAll('#tabs button');
for(var i=0;i<tb.length;i++)tb[i].onclick=function(){for(var j=0;j<tb.length;j++)tb[j].classList.remove('on');this.classList.add('on');K=this.getAttribute('data-k');render();};
var lb=document.querySelectorAll('.lang button');
for(var i2=0;i2<lb.length;i2++)lb[i2].onclick=function(){LANG=this.getAttribute('data-l');applyLang();};
applyLang();
</script>
</body>
</html>
