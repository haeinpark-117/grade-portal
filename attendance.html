<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<title>Attendance</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316a34a'/%3E%3Crect x='17' y='14' width='30' height='38' rx='5' fill='%23fff'/%3E%3Crect x='25' y='10' width='14' height='8' rx='3' fill='%23dcfce7' stroke='%2316a34a' stroke-width='2'/%3E%3Cpath d='M23.5 34.5l6 6 11-12' fill='none' stroke='%2316a34a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="180x180" href="https://haeinpark-117.github.io/grade-portal/attendance-icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="https://haeinpark-117.github.io/grade-portal/attendance-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://haeinpark-117.github.io/grade-portal/attendance-icon.png?v=2">
<meta name="theme-color" content="#16a34a">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #wl { position: fixed; top: calc(6px + env(safe-area-inset-top)); right: 8px; z-index: 5;
        font: 600 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        padding: 5px 10px; border-radius: 999px; border: 0; background: #1a1a2e; color: #fff; opacity: .85; }
  #wl.on { background: #e9eaff; color: #3840f3; opacity: .7; }
  #note { font: 16px -apple-system, system-ui, sans-serif; padding: 24px; line-height: 1.5; }
</style>
</head>
<body>
<iframe id="app" allow="screen-wake-lock" title="Attendance"></iframe>
<button id="wl" type="button">화면 켜두기</button>
<script>
  // Wrapper that keeps the screen awake while the attendance app is open.
  // The Apps Script deployment id comes from the link (?id=...), so this public file
  // contains no app address. The wake lock is requested by this top-level page, which
  // is allowed to hold one (the Apps Script frame alone is not).
  var id = new URLSearchParams(location.search).get('id') || location.hash.slice(1);
  if (!/^AKfycb[A-Za-z0-9_-]{20,}$/.test(id || '')) {
    document.body.innerHTML = '<p id="note">Open this page with the full attendance link (…/attendance.html?id=…).</p>';
  } else {
    // khu.ac.kr path: the plain /macros/s/ address fails ("unable to open") when the browser is
    // signed in to several Google accounts. Add &plain=1 to the link to use the plain address.
    var base = new URLSearchParams(location.search).get('plain') ? 'https://script.google.com/macros/s/' : 'https://script.google.com/a/macros/khu.ac.kr/s/';
    document.getElementById('app').src = base + id + '/exec';
    var lock = null, btn = document.getElementById('wl');
    var show = function () {
      btn.className = lock ? 'on' : '';
      btn.textContent = lock ? '화면 켜짐 ✓' : ('wakeLock' in navigator ? '화면 켜두기 (탭)' : '이 브라우저는 지원 안 함');
    };
    var keepAwake = function () {
      if (lock || document.visibilityState !== 'visible' || !('wakeLock' in navigator)) { show(); return; }
      navigator.wakeLock.request('screen').then(function (l) {
        lock = l; show();
        l.addEventListener('release', function () { lock = null; show(); });
      }).catch(show);
    };
    btn.addEventListener('click', keepAwake);
    document.addEventListener('visibilitychange', keepAwake);
    window.addEventListener('focus', keepAwake);
    setInterval(keepAwake, 15000);
    keepAwake();
  }
</script>
</body>
</html>
